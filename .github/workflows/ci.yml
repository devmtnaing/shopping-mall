name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # real Postgres for the content database tests
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mall
          POSTGRES_PASSWORD: mall
          POSTGRES_DB: mall
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mall" --health-interval 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://mall:mall@localhost:5432/mall
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Size budget
        run: pnpm size >> "$GITHUB_STEP_SUMMARY"

  docker:
    # builds both images and checks the stack actually serves the mall and the server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: WEB_PORT=8080 docker compose up -d
      - name: Smoke test
        run: |
          for i in $(seq 1 30); do curl -sf localhost:8080/health && break; sleep 1; done
          curl -sf localhost:8080/health | grep '"ok":true'
          curl -sf localhost:8080/ | grep -q '<canvas id="gl"'
          curl -sf localhost:8080/directory/ | grep -q 'Shop directory'
      - if: always()
        run: docker compose logs && docker compose down
