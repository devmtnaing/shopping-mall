server {
  listen 80;
  root /usr/share/nginx/html;

    # content-hashed build files (name-AbCd1234.js) never change: cache for a year.
  # Un-hashed files (the mall model under /assets/mall/) are revalidated instead.
  location ~* "^/assets/[^/]+-[A-Za-z0-9_-]{8}\.(js|css|woff2|png|svg|jpg|webp)$" {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # multiplayer server on the same origin
  location /ws {
    proxy_pass http://server:8787;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }
  location ~ ^/(health|host-token)$ {
    proxy_pass http://server:8787;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  gzip on;
  gzip_types application/javascript text/css application/json image/svg+xml application/octet-stream model/gltf-binary;
}
