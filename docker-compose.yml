# The whole mall, multiplayer included:  docker compose up --build  →  http://localhost:8080
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mall
      POSTGRES_PASSWORD: mall
      POSTGRES_DB: mall
    ports:
      - "127.0.0.1:5433:5432" # for local development (pnpm dev:server); 5433 avoids clashing with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mall"]
      interval: 2s
      retries: 30
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      # set these in a .env file next to this one (see .env.example)
      HOST_SECRET: ${HOST_SECRET:-}
      REPORT_WEBHOOK: ${REPORT_WEBHOOK:-}
      ROOM_CAPACITY: ${ROOM_CAPACITY:-100}
      DATABASE_URL: postgres://mall:mall@postgres:5432/mall
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pgdata:
