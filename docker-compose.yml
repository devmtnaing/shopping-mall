# The whole mall, multiplayer included:  docker compose up --build  →  http://localhost:8080
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mall
      POSTGRES_PASSWORD: mall
      POSTGRES_DB: mall
    ports:
      - "127.0.0.1:5433:5432" # for local development (pnpm dev:server); 5433 avoids clashing with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mall"]
      interval: 2s
      retries: 30
    restart: unless-stopped

  # S3-compatible storage for uploads (production uses a Railway bucket; any S3 store works)
  storage:
    image: chrislusf/seaweedfs:latest
    # small volumes, as many as the disk holds: the defaults (30 GB volumes, a few of them) run out
    # once test runs have created a few dozen buckets
    command: server -s3 -dir=/data -volume.max=0 -master.volumeSizeLimitMB=100
    environment:
      AWS_ACCESS_KEY_ID: mall
      AWS_SECRET_ACCESS_KEY: mall-secret
    ports:
      - "127.0.0.1:8333:8333" # for local development (pnpm dev:server)
    volumes:
      - s3data:/data
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      # set these in a .env file next to this one (see .env.example)
      HOST_SECRET: ${HOST_SECRET:-}
      REPORT_WEBHOOK: ${REPORT_WEBHOOK:-}
      ROOM_CAPACITY: ${ROOM_CAPACITY:-100}
      MAX_PLAYERS: ${MAX_PLAYERS:-20}
      MAX_PER_IP: ${MAX_PER_IP:-5}
      CHAT_KEEP_DAYS: ${CHAT_KEEP_DAYS:-30}
      DATABASE_URL: postgres://mall:mall@postgres:5432/mall
      S3_ENDPOINT: http://storage:8333
      S3_BUCKET: mall
      S3_ACCESS_KEY_ID: mall
      S3_SECRET_ACCESS_KEY: mall-secret
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pgdata:
  s3data:
